name: Reconstruir el sitio cada día

# El "próximo partido" se calcula en el build. Aunque nadie publique nada,
# reconstruir una vez por día evita que quede un partido viejo como próximo.
on:
  schedule:
    - cron: '17 9 * * *' # 06:17 en Argentina
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al Deploy Hook de Cloudflare Pages
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Falta el secreto CLOUDFLARE_DEPLOY_HOOK_URL; no se reconstruye."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
